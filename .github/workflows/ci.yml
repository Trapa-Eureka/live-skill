name: CI

# T11 (docs/TASKS.md) — enforces `npm run check` on every push to main and every PR
# (docs/PUBLISHING.md §3-9). Runs the same sequence as the local `prepublishOnly` script
# (check → build → check:tarball → verify:pack) in one job. This repo is still small (single CLI, no service
# dependencies) — a retail-mcp-style matrix of coverage/audit/SBOM/postgres jobs is deliberately not
# copied here; add jobs only when the repo's actual risk profile grows to need them.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every step only checks out the repo and runs local npm scripts, none of which
# write back to GitHub — contents:read is the only permission needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # engines.node requires >=22.12.0 (package.json, I2): commander 15 needs >=22.12, pdf-parse
        # >=22.3 — Node 20 (EOL 2026-04) only worked by accident. 22 is the floor, 24 the current LTS.
        node: [22, 24]
    steps:
      # Actions pinned to a full commit SHA (not a movable tag) — verified against the tag shown in
      # the trailing comment via `gh api repos/<owner>/<action>/git/ref/tags/<tag>`. Update by bumping
      # both the SHA and the comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run check:tarball
      # H2 (AUD-017): install the real tarball with --omit=dev into a clean temp project and run the CLI.
      - run: npm run verify:pack
